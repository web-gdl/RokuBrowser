# Al subir una etiqueta vX.Y.Z: valida el codigo, arma el ZIP y crea la Release con el archivo adjunto.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar y probar
        run: |
          npm ci
          npm run lint
          npm test

      - name: Empaquetar
        run: bash tools/build.sh

      - name: Crear la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: download/NavegadorWebRoku.zip
          generate_release_notes: true
